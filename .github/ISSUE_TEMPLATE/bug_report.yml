name: 🐞 Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clipmaster version and OS
      placeholder: 0.1.0 on Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or export log
      render: text
