name: Release

# Builds installers for Windows, macOS (Apple Silicon + Intel) and Linux with
# FFmpeg and whisper.cpp bundled, and attaches them to a draft GitHub release.
# Trigger: push a tag like v0.2.0, or run manually from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin
            whisper_cmake: -DGGML_METAL=OFF
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Bundle FFmpeg + whisper.cpp
        shell: bash
        env:
          WHISPER_CMAKE_ARGS: ${{ matrix.whisper_cmake }}
        run: scripts/fetch-sidecars.sh ${{ matrix.target }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', '__VERSION__') }}
          releaseName: Clipmaster ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Free, open-source video editor. FFmpeg and whisper.cpp are included — just install and edit.
            macOS: the app is not notarized yet; right-click → Open the first time.
          releaseDraft: true
          prerelease: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json
