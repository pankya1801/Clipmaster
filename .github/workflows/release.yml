name: Release

# Builds installers for Windows, macOS (Apple Silicon + Intel) and Linux with
# FFmpeg and whisper.cpp bundled, and publishes them as GitHub release
# v<version from tauri.conf.json> with notes from .github/release-notes.md.
# Trigger: run manually from the Actions tab (or push a tag like v0.2.0).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs: cross-compiled on the Apple Silicon runner (GitHub retired
          # the macos-13 Intel runners, so jobs requesting them never start).
          - platform: macos-latest
            target: x86_64-apple-darwin
            whisper_cmake: -DGGML_METAL=OFF -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_SYSTEM_PROCESSOR=x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Bundle FFmpeg + whisper.cpp
        shell: bash
        env:
          WHISPER_CMAKE_ARGS: ${{ matrix.whisper_cmake }}
        run: scripts/fetch-sidecars.sh ${{ matrix.target }}
      - run: npm ci
      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<__NOTES__"
            cat .github/release-notes.md
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Clipmaster v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json
